name: Test & Export Cyber Tower Defense

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  test:
    name: Run Headless Testsuite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Run A* Pathfinding & Mazing Tests
        run: |
          godot --headless -s test_gameplay.gd

  export:
    name: Build & Package Web Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot & Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Create Build Directories
        run: |
          mkdir -p builds/web

      - name: Import Resources
        run: |
          godot --headless --editor --quit

      - name: Export Web (HTML5)
        run: |
          godot --headless --export-release "Web" builds/web/index.html || test -f builds/web/index.html

      - name: Package ZIP Archives
        run: |
          cd builds/web && zip -r ../../CyberTowerDefense-Web.zip . && cd ../..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberTowerDefense-Web
          path: CyberTowerDefense-Web.zip

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
